<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Polaris IA — Neural Brain Monitor 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/3d-force-graph"></script>
<script src="https://unpkg.com/three"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02050A;
  --glass:rgba(10, 20, 40, 0.6);
  --glass-border:rgba(0, 221, 255, 0.2);
  --accent:#00DDFF;
  --neon-green:#00FF88;
  --neon-purple:#BB44FF;
  --text:#E0E6ED;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Share Tech Mono',monospace;
  height:100vh;
  overflow:hidden;
  margin:0;
}

/* ── GLASSMORPHISM UI ── */
.ui-overlay {
  position: absolute;
  z-index: 100;
  pointer-events: none;
}
.glass {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
  pointer-events: auto;
}

header {
  top: 20px;
  left: 20px;
  right: 20px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.logo-wrap { display: flex; align-items: center; gap: 15px; }
.logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--accent); letter-spacing: 4px; text-shadow: 0 0 10px var(--accent); }
.logo span { display: block; font-size: 0.6rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; }

.status-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 16px;
  background: rgba(0, 255, 136, 0.1);
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 20px;
  font-size: 0.7rem;
  color: var(--neon-green);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

/* Sidebar Metrics */
.sidebar {
  top: 110px;
  right: 20px;
  width: 260px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.metric-card {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.metric-label { font-size: 0.6rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-bottom: 5px; }
.metric-value { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); }
.progress-mini { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

/* Progress Bar (Bottom) */
.bottom-bar {
  bottom: 20px;
  left: 20px;
  right: 20px;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  gap: 20px;
}
#prog-info { flex: 1; min-width: 0; }
#prog-phase { font-size: 0.6rem; color: var(--neon-green); letter-spacing: 2px; margin-bottom: 4px; }
#prog-topic { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-track { flex: 2; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
#prog-fill { height: 100%; background: linear-gradient(90deg, var(--neon-green), var(--accent)); width: 0%; transition: width 0.5s; }
#prog-pct { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--neon-green); width: 60px; text-align: right; }

#3d-graph { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<div id="3d-graph"></div>

<!-- UI OVERLAYS -->
<header class="ui-overlay glass">
  <div class="logo-wrap">
    <div class="logo">POLARIS IA <span>BRAIN NEURAL MONITOR v3.0</span></div>
  </div>
  <div style="display:flex; align-items:center; gap:20px">
    <div id="neuron-counter" style="font-size:0.8rem; color:rgba(255,255,255,0.6)">0 NEURONAS</div>
    <div class="status-pill"><div class="dot"></div><span id="status-txt">SISTEMA ONLINE</span></div>
  </div>
</header>

<aside class="sidebar ui-overlay glass">
  <div class="metric-card">
    <div class="metric-label">NEURONAS TOTALES</div>
    <div class="metric-value" id="m-neurons">0</div>
    <div class="progress-mini"><div class="progress-fill" id="p-neurons"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">PÉRDIDA (LOSS)</div>
    <div class="metric-value" id="m-loss" style="color:var(--neon-green)">0.0000</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">EVENTOS CRECIMIENTO</div>
    <div class="metric-value" id="m-growth" style="color:#FF6B35">0</div>
  </div>
  <div class="metric-card" style="border:none">
    <div class="metric-label">TEMA ACTUAL</div>
    <div id="m-topic" style="font-size:0.7rem; line-height:1.4; color:var(--accent)">Esperando...</div>
  </div>
  <button class="glass" style="margin-top:10px; padding:12px; color:var(--accent); border:1px solid var(--glass-border); cursor:pointer; font-family:'Orbitron'; font-size:0.6rem; letter-spacing:2px" onclick="triggerCycle()">⚡ FORZAR CICLO</button>
</aside>

<div class="bottom-bar ui-overlay glass" id="bottom-progress">
  <div id="prog-info">
    <div id="prog-phase">IDLE</div>
    <div id="prog-topic">Esperando instrucciones...</div>
  </div>
  <div class="prog-track"><div id="prog-fill"></div></div>
  <div id="prog-pct">0%</div>
</div>

<script>
const SERVER = 'https://pdlc-polaris-ia.hf.space/';
const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
  .backgroundColor('#02050A')
  .showNavInfo(false)
  .nodeLabel('id')
  .nodeAutoColorBy('group')
  .linkOpacity(0.2)
  .linkWidth(0.5)
  .linkDirectionalParticles(2)
  .linkDirectionalParticleSpeed(d => d.value * 0.01)
  .nodeThreeObject(node => {
    const obj = new THREE.Mesh(
      new THREE.SphereGeometry(node.size || 4),
      new THREE.MeshPhongMaterial({
        color: node.color || '#00DDFF',
        transparent: true,
        opacity: 0.9,
        emissive: node.color || '#00DDFF',
        emissiveIntensity: 0.5
      })
    );
    return obj;
  });

function getBrainPosition(id, total) {
  const isLeft = id % 2 === 0;
  const phi = Math.acos(-1 + (2 * id) / total);
  const theta = Math.sqrt(total * Math.PI) * phi;
  const xShift = isLeft ? -25 : 25;
  
  return {
    x: xShift + (60 * Math.sin(phi) * Math.cos(theta)) * 0.8,
    y: (100 * Math.sin(phi) * Math.sin(theta)) * 1.2,
    z: (60 * Math.cos(phi)) * 1.0
  };
}

let graphData = { nodes: [], links: [] };
let prevCount = 0;

async fun updateData() {
  try {
    const res = await fetch(SERVER + 'status');
    const data = await res.json();
    
    const count = data.neural_network?.neurons || data.neurons || 0;
    const loss = data.learning?.current_loss || data.loss || 0;
    const growth = data.neural_network?.growth_events || data.growth_events || 0;
    const topic = data.last_cycle?.topic || data.last_topic || '—';
    
    document.getElementById('m-neurons').textContent = count;
    document.getElementById('m-loss').textContent = loss.toFixed(4);
    document.getElementById('m-growth').textContent = growth;
    document.getElementById('m-topic').textContent = topic;
    document.getElementById('neuron-counter').textContent = `${count} NEURONAS`;
    document.getElementById('p-neurons').style.width = Math.min(100, (count/1000)*100) + '%';
    
    if (count !== prevCount) {
      const newNodes = [];
      const newLinks = [];
      for (let i = 0; i < count; i++) {
        const pos = getBrainPosition(i, count);
        newNodes.push({ id: i, group: i % 2, color: i % 2 === 0 ? '#00DDFF' : '#BB44FF', size: i < 10 ? 8 : 4, ...pos });
        if (i > 0) {
          const target = Math.max(0, i - 1 - Math.floor(Math.random() * 5));
          newLinks.push({ source: i, target: target, value: Math.random() });
          if (i % 20 === 0) newLinks.push({ source: i, target: i - 1, value: 2 });
        }
      }
      graphData = { nodes: newNodes, links: newLinks };
      Graph.graphData(graphData);
      prevCount = count;
    }
  } catch (e) {}
}

async function updateProgress() {
  try {
    const res = await fetch(SERVER + 'progress');
    const p = await res.json();
    const bar = document.getElementById('bottom-progress');
    if (p.active) {
      bar.style.display = 'flex';
      document.getElementById('prog-phase').textContent = (p.phase || 'TRAINING').toUpperCase();
      document.getElementById('prog-topic').textContent = p.topic || 'Analizando datos...';
      document.getElementById('prog-fill').style.width = (p.percent || 0) + '%';
      document.getElementById('prog-pct').textContent = Math.round(p.percent || 0) + '%';
    } else {
      setTimeout(() => { if (!p.active) bar.style.display = 'none'; }, 5000);
    }
  } catch (e) {}
}

function triggerCycle() { fetch(SERVER + 'trigger-cycle'); }

setInterval(updateData, 5000);
setInterval(updateProgress, 1000);
updateData();

const bloomPass = new THREE.UnrealBloomPass();
bloomPass.strength = 1.2;
bloomPass.radius = 0.3;
Graph.postProcessingComposer().addPass(bloomPass);

</script>
</body>
</html>
